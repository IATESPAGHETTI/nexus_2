# Runs as a normal user inside the Space: every writable path points at /app/run or /tmp.
pid /app/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  include /etc/nginx/mime.types;

  server {
    listen 7860;
    server_name _;
    include /app/run/auth.conf;
    include /app/run/token.conf;
    root /app/web;
    index index.html;

    location / { try_files $uri /index.html; }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Approver-Token $approver_token;
      proxy_read_timeout 120s;
    }

    # customer traffic to the simulated shop: GET /orders and /orders/<id> only
    location ~ ^/production/(orders(/[0-9]+)?)$ {
      limit_except GET { deny all; }
      rewrite ^/production/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:8001;
    }
    # --- the simulated shop, served on the dashboard's own address (same login) ---
  location = /shop { return 301 /shop/; }
  location = /shop/ {
    rewrite ^ /shop break;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script>window.NEXUS_API_BASE="/shop-api";</script></head>';
    sub_filter_once on;
  }
  # the shop's own API, narrowed to what a shopper needs: list/create orders, read one order, list products
  location = /shop-api/orders {
    limit_except GET POST { deny all; }
    rewrite ^/shop-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8001;
  }
  location ~ ^/shop-api/(orders/[0-9]+|products)$ {
    limit_except GET { deny all; }
    rewrite ^/shop-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8001;
  }
  location /shop-api/ { return 403; }

  location /production/ { return 403; }
  }
}
